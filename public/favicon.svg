<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    SyncCharacter.jsx 로딩 애니메이션에서 두 원이 약 50% 겹친 시점을 정적으로 캡처한 파비콘.
    r=40, 중심 거리=32 (거리/반지름=0.8) → 겹친 넓이 ≈ 한쪽 원 면적의 50%.
    겹치는 부분·테두리만 색이 있고 나머지 배경은 투명(SVG 기본값, 별도 rect 없음).
    색은 앱 CSS 변수(color accent 등)를 그대로 쓸 수 없어 값을 그대로 박아 넣었다.
  -->
  <defs>
    <clipPath id="favicon-overlap-clip">
      <circle cx="48" cy="64" r="40" />
    </clipPath>
  </defs>

  <!-- 겹치는 영역: 흰색 50% + 하늘색(#00A5E3) 50%를 섞은 색(#80D2F2) -->
  <circle cx="80" cy="64" r="40" fill="#80D2F2" clip-path="url(#favicon-overlap-clip)" />

  <!-- 흰색 테두리 원 (배경 없음) -->
  <circle cx="48" cy="64" r="40" fill="none" stroke="#FFFFFF" stroke-width="10" />

  <!-- 하늘색 테두리 원 (배경 없음) -->
  <circle cx="80" cy="64" r="40" fill="none" stroke="#00A5E3" stroke-width="10" />
</svg>
